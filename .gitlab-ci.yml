image: maven:3.9-eclipse-temurin-21

stages:
  - build
  - test
  - docker

build:
  stage: build
  script:
    - java -version
    - mvn -B -DskipTests clean package

test:
  stage: test
  script:
    - java -version
    - mvn -B test

docker-build:
  stage: docker
  image: maven:3.9-eclipse-temurin-21
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apt-get update && apt-get install -y docker.io
    - docker version
  script:
    - mvn -pl api-gateway -am -DskipTests clean package
    - docker build -t shoplite-api-gateway:ci ./api-gateway
