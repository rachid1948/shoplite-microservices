stages:
  - build
  - test
  - docker

build-jars:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn -DskipTests clean package
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - api-gateway/target/*.jar
      - config-server/target/*.jar
      - customer-service/target/*.jar
      - discovery-server/target/*.jar
      - order-service/target/*.jar
      - product-service/target/*.jar

test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - java -version
    - mvn -B test

docker-build:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: build-jars
      artifacts: true
  script:
    - docker version
    - docker build -t shoplite-api-gateway:ci ./api-gateway
    - docker build -t shoplite-config-server:ci ./config-server
    - docker build -t shoplite-customer-service:ci ./customer-service
    - docker build -t shoplite-discovery-server:ci ./discovery-server
    - docker build -t shoplite-order-service:ci ./order-service
    - docker build -t shoplite-product-service:ci ./product-service

docker-push-api-gateway:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: build-jars
      artifacts: true
  only:
    - main
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -t "$DOCKERHUB_USERNAME/shoplite-api-gateway:$CI_COMMIT_SHORT_SHA" ./api-gateway
    - docker push "$DOCKERHUB_USERNAME/shoplite-api-gateway:$CI_COMMIT_SHORT_SHA"

